<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Orchestrator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Menlo, monospace;
      background: #0a0e27;
      color: #e0e7ff;
      display: flex;
      height: 100vh;
    }

    .container {
      display: flex;
      height: 100vh;
      overflow: hidden;
      width: 100%;
      gap: 1px;
      background: #1a1f2e;
    }

    /* LEFT: Chat Panel */
    .chat-panel {
      flex: 0 0 40%;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #0a0e27;
      border-right: 1px solid #312e81;
    }

    .chat-header {
      background: linear-gradient(90deg, #1e3a8a 0%, #1e1b4b 100%);
      border-bottom: 1px solid #3730a3;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .chat-header h1 {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .model-picker {
      background: #111318;
      border: 1px solid #312e81;
      color: #e0e7ff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    .model-picker:hover {
      border-color: #6366f1;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      word-wrap: break-word;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.user {
      background: #6366f1;
      color: white;
      align-self: flex-end;
      max-width: 85%;
    }

    .message.assistant {
      background: #1e293b;
      border: 1px solid #312e81;
      color: #a5b4fc;
      align-self: flex-start;
      max-width: 85%;
      white-space: pre-wrap;
      font-family: 'Menlo', monospace;
      font-size: 13px;
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid #312e81;
      display: flex;
      gap: 8px;
    }

    .message-input {
      flex: 1;
      background: #111318;
      border: 1px solid #312e81;
      border-radius: 6px;
      padding: 10px 12px;
      color: #e0e7ff;
      font-size: 14px;
      font-family: inherit;
    }

    .message-input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .send-btn {
      padding: 10px 24px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .send-btn:hover:not(:disabled) {
      background: #4f46e5;
    }

    .send-btn:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }

    /* RIGHT: Terminals Panel */
    .terminals-panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #0a0e27;
      overflow: hidden;
    }

    .terminals-header {
      background: linear-gradient(90deg, #1e3a8a 0%, #1e1b4b 100%);
      border-bottom: 1px solid #3730a3;
      padding: 16px;
    }

    .terminals-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .terminals-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .terminal-panel {
      background: #111318;
      border: 1px solid #312e81;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: none;
    }

    .terminal-header {
      background: #1a1f2e;
      border-bottom: 1px solid #312e81;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #6366f1;
    }

    .terminal-label {
      text-transform: uppercase;
    }

    .terminal-status {
      font-size: 11px;
      color: #a5b4fc;
      opacity: 0.8;
    }

    .terminal-body {
      flex: 1;
      overflow: auto;
      padding: 8px 10px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 260px;
      background: #0a0e27;
      font-family: 'Menlo', monospace;
      font-size: 12px;
    }

    .xterm {
      width: 100%;
      height: 100%;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 40px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #111318;
    }

    ::-webkit-scrollbar-thumb {
      background: #312e81;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4c1d95;
    }

    .streaming {
      opacity: 0.7;
    }

    .agent-card {
      background: #111318; border: 1px solid #312e81; border-radius: 8px;
      padding: 12px 14px; cursor: pointer; font-size: 13px; line-height: 1.45;
    }
    .agent-card:hover { border-color: #6366f1; }
    .agent-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .agent-top b { font-size: 14px; flex: 1; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .pill { font-size: 11px; border: 1px solid; border-radius: 10px; padding: 1px 8px; }
    .muted { color: #64748b; font-size: 11px; }
    .small { margin-top: 6px; }
    .row { color: #cbd5e1; margin-top: 3px; }
    .row span { color: #64748b; display: inline-block; width: 74px; font-size: 11px; text-transform: uppercase; }
    .blocked { background: rgba(245,158,11,.12); border: 1px solid #f59e0b; color: #fcd34d; border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
    .note { color: #94a3b8; font-size: 12px; margin: 4px 0; }
    .raw { background: #0a0e27; border-radius: 6px; padding: 8px; margin-top: 8px; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }

    .sys-note { align-self: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #312e81; padding-top: 6px; margin-top: 4px; }
    .mission { background: #111318; border: 1px solid #312e81; border-radius: 8px; padding: 10px 14px; font-size: 12px; }
    .mission-line { display: flex; justify-content: space-between; gap: 10px; color: #cbd5e1; margin-bottom: 6px; flex-wrap: wrap; }
    .bar { background: #0a0e27; border-radius: 6px; height: 8px; overflow: hidden; }
    .bar div { background: #10b981; height: 100%; transition: width .4s; }
    .tasks { margin-top: 8px; border-top: 1px solid #1e293b; padding-top: 6px; }
    .task { font-size: 12px; color: #94a3b8; margin-top: 3px; display: flex; gap: 6px; align-items: baseline; }
    .task span { flex: none; } .task em { flex: none; font-style: normal; color: #cbd5e1; }
    .task i { margin-left: auto; font-style: normal; color: #64748b; font-size: 11px; flex: none; }
    .task.waiting em { color: #fcd34d; } .task.stalled em, .task.lost em { color: #f87171; } .task.seen em, .task.reported em { color: #34d399; }
    .steps {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .steps:empty { display: none; }
    .message.assistant code {
      background: #0f172a;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .mic-btn {
      padding: 10px 12px;
      background: #1e293b;
      color: #e0e7ff;
      border: 1px solid #312e81;
      border-radius: 6px;
      cursor: pointer;
    }
    .mic-btn.listening { background: #dc2626; border-color: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <!-- LEFT: Chat -->
    <div class="chat-panel">
      <div class="chat-header">
        <h1>💬 Master Orchestrator</h1>
        <select id="modelPicker" class="model-picker">
          <option value="claude-haiku-4-5-20251001" selected>Haiku 4.5</option>
          <option value="claude-sonnet-5-5">Sonnet 5.5</option>
          <option value="claude-opus-5-5">Opus 5.5</option>
        </select>
      </div>

      <div id="messagesContainer" class="messages">
        <div class="message assistant">
          👋 Hi! I'm your master orchestration agent. What would you like me to orchestrate?
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          class="message-input"
          placeholder="e.g., Run tests on the main branch"
          autocomplete="off"
        />
        <button class="mic-btn" id="micBtn" title="Dictate (click, speak, it sends when you pause)">🎤</button>
        <button class="mic-btn" id="stopBtn" style="display:none" title="Stop the task the orchestrator is working on">■ Stop</button>
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
    </div>

    <!-- RIGHT: Live Terminals -->
    <div class="terminals-panel">
      <div class="terminals-header">
        <h2>🧭 Your agents</h2>
      </div>

      <div id="terminalsContainer" class="terminals-content">
        <div class="empty-state">
          <div>No terminals running</div>
          <div style="font-size: 12px; margin-top: 8px; opacity: 0.6;">Waiting for agents to start...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const messagesContainer = document.getElementById('messagesContainer');
    const modelPicker = document.getElementById('modelPicker');
    const terminalsContainer = document.getElementById('terminalsContainer');

    const ORCHESTRATOR_URL = 'http://localhost:3003';
    // Terminal list comes via the orchestrator, which merges in cockpit labels (older bridges lack them).
    const BRIDGE_URL = ORCHESTRATOR_URL;

    const terminals = new Map(); // Map of sid -> {terminal, fitAddon}

    // Add a message to the chat
    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return div;
    }

    // Escape, then apply the little markdown the orchestrator uses (bold, inline code).
    function renderReply(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    // ---- Chat: driven by the orchestrator's live event stream (/events) ----
    let currentBubble = null;   // assistant bubble being filled for the current turn
    let replyDiv = null, stepsDiv = null, replyText = '';
    let lastSeq = 0;

    function ensureBubble() {
      if (currentBubble) return;
      currentBubble = addMessage('assistant', '');
      stepsDiv = document.createElement('div'); stepsDiv.className = 'steps';
      replyDiv = document.createElement('div');
      currentBubble.append(stepsDiv, replyDiv);
      replyText = '';
    }
    function note(text, cls) {
      const n = document.createElement('div');
      n.className = 'sys-note' + (cls ? ' ' + cls : '');
      n.textContent = text;
      messagesContainer.appendChild(n);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    const NOTICE_TEXT = {
      held: '⏸ A message is on hold: the agent\'s user has to approve it before the agent sees it',
      released: '▶ Held message approved and delivered',
      denied: '✕ A held message was denied',
      expired: '⌛ A held message expired without being delivered',
      refused: '✕ An agent refused cross-session messages',
    };

    function handleEvent(e) {
      lastSeq = Math.max(lastSeq, e.seq || 0);
      if (e.kind === 'user') { addMessage('user', e.text); currentBubble = null; stopBtn.style.display = 'inline-block'; }
      else if (e.kind === 'tool') {
        ensureBubble();
        const s = document.createElement('div'); s.textContent = '→ ' + e.command; stepsDiv.appendChild(s);
      } else if (e.kind === 'text') {
        ensureBubble();
        replyText += (replyText ? '\n\n' : '') + e.text;
        replyDiv.innerHTML = renderReply(replyText);
      } else if (e.kind === 'turn') {
        if (e.state === 'start') stopBtn.style.display = 'inline-block';
        else { stopBtn.style.display = 'none'; currentBubble = null; }
      } else if (e.kind === 'peer') {
        note('↩ Message from ' + (e.fromName || 'an agent') + ': ' + e.text.slice(0, 180));
        currentBubble = null;
      } else if (e.kind === 'notice') {
        if (e.state === 'idle') note('✓ ' + (e.text.match(/^"([^"]+)"/)?.[1] || 'An agent') + ' finished what it was doing');
        else note(NOTICE_TEXT[e.state] || e.text);
      } else if (e.kind === 'error') {
        ensureBubble(); replyDiv.textContent = '❌ ' + e.text; currentBubble = null; stopBtn.style.display = 'none';
      }
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      refreshSoon();
    }

    let es = null;
    function connectEvents() {
      if (es) es.close();
      es = new EventSource(`${ORCHESTRATOR_URL}/events` + (lastSeq ? `?since=${lastSeq}` : ''));
      es.onmessage = (m) => { try { handleEvent(JSON.parse(m.data)); } catch (err) { /* ignore */ } };
      es.onerror = () => { es.close(); setTimeout(connectEvents, 1500); };   // reconnect, replaying what we missed
    }
    let refreshTimer = null;
    function refreshSoon() { clearTimeout(refreshTimer); refreshTimer = setTimeout(refreshTerminals, 600); }

    // Send a message: the server echoes it back on the event stream, which is what draws the bubble.
    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;
      messageInput.value = '';
      try {
        await fetch(`${ORCHESTRATOR_URL}/chat`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, model: modelPicker.value }),
        });
      } catch (err) {
        note('❌ Could not reach the orchestrator: ' + err.message);
      }
    }

    // One status card per agent, from the orchestrator's digest (the same data the orchestrator reads).
    const STATE_STYLE = {
      WORKING: ['#10b981', 'Working'],
      IDLE: ['#64748b', 'Idle'],
      BLOCKED: ['#f59e0b', 'Needs your decision'],
      UNKNOWN: ['#64748b', 'Unknown'],
    };
    const expanded = new Set();
    const esc = (t) => String(t ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const ago = (s) => s == null ? '' : s < 5 ? 'just now' : s < 90 ? `${s}s ago` : s < 5400 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`;

    async function refreshTerminals() {
      try {
        const [st, tl] = await Promise.all([
          fetch(`${ORCHESTRATOR_URL}/status`).then((r) => r.json()),
          fetch(`${ORCHESTRATOR_URL}/terminals?tail=1500`).then((r) => r.json()).catch(() => ({ sessions: [] })),
        ]);
        const tails = Object.fromEntries((tl.sessions || []).map((s) => [s.sid, s.bufferTail]));
        const agents = st.agents || [];

        if (!agents.length) {
          terminalsContainer.innerHTML = `<div class="empty-state"><div>${st.error ? esc(st.error) : 'No agents running'}</div></div>`;
          return;
        }

        const sm = st.summary || { total: 0, waiting: 0, replied: 0, stalled: 0 };
        const blocked = agents.filter((a) => a.state === 'BLOCKED').length;
        const pct = sm.total ? Math.round((sm.replied / sm.total) * 100) : 0;
        const summaryHtml = `<div class="mission">
          <div class="mission-line"><b>Delegations, last hour</b>
            <span>${sm.replied} of ${sm.total} answered · ${sm.waiting} waiting${sm.stalled ? ` · ${sm.stalled} stalled` : ''}${blocked ? ` · <b style="color:#fcd34d">${blocked} agent${blocked > 1 ? 's' : ''} need${blocked > 1 ? '' : 's'} you</b>` : ''}</span></div>
          <div class="bar"><div style="width:${pct}%"></div></div></div>`;
        const TASK_LABEL = { waiting: ['⏳', 'waiting for reply'], seen: ['✓', 'answered'], reported: ['✓', 'answered'], stalled: ['⚠', 'no reply'], lost: ['?', 'lost track'] };
        terminalsContainer.innerHTML = summaryHtml + agents.map((a) => {
          const [color, name] = STATE_STYLE[a.state] || STATE_STYLE.UNKNOWN;
          const open = expanded.has(a.sid);
          const raw = (tails[a.sid] || '').split('\n').filter((l) => l.trim() && !/^[\s─━│╭╮╰╯]+$/.test(l)).slice(-30).join('\n');
          return `<div class="agent-card" data-sid="${esc(a.sid)}">
            <div class="agent-top">
              <span class="dot" style="background:${color}"></span>
              <b>${esc(a.topic || a.label)}</b>
              <span class="pill" style="color:${color};border-color:${color}">${name}</span>
              <span class="muted">${ago(a.secondsSinceActivity)}</span>
            </div>
            <div class="muted" style="margin:-2px 0 6px 17px">id ${esc(a.sid.slice(0, 8))} · panel label “${esc(a.label)}” (labels can be wrong)</div>
            ${a.state === 'BLOCKED' ? `<div class="blocked">Waiting on you: it is stopped at a permission prompt${a.prompt ? ` (${esc(a.prompt)})` : ''}. Tell the orchestrator to approve or deny it.</div>` : ''}
            ${a.hasGoalLoop ? `<div class="note">Has a /goal loop${a.goal ? ` (“${esc(a.goal.slice(0, 90))}”)` : ''}: it restarts itself whenever it goes idle, so it may flicker between idle and working.</div>` : ''}
            ${a.doing ? `<div class="row"><span>Last said</span>${esc(a.doing)}</div>` : ''}
            ${a.lastAsked ? `<div class="row"><span>Last asked</span>${esc(a.lastAsked)}</div>` : ''}
            ${(a.tasks || []).length ? `<div class="tasks">${a.tasks.map((t) => { const [ic, lb] = TASK_LABEL[t.status] || ['•', t.status]; return `<div class="task ${t.status}"><span>${ic}</span><em>${lb}</em> ${esc(t.text)} <i>${ago(Math.round(Date.now() / 1000 - t.sentAt))}</i></div>`; }).join('')}</div>` : ''}
            <div class="muted small">${open ? 'hide' : 'show'} raw screen</div>
            ${open ? `<pre class="raw">${esc(raw) || '(nothing readable)'}</pre>` : ''}
          </div>`;
        }).join('');
      } catch (error) {
        console.error('Error refreshing agents:', error);
      }
    }

    terminalsContainer.addEventListener('click', (e) => {
      const card = e.target.closest('.agent-card');
      if (!card) return;
      const sid = card.dataset.sid;
      expanded.has(sid) ? expanded.delete(sid) : expanded.add(sid);
      refreshTerminals();
    });

    // Restore the conversation after a refresh (the orchestrator session persists server-side), then go live.
    async function restoreHistory() {
      try {
        const { messages, busy } = await fetch(`${ORCHESTRATOR_URL}/history`).then((r) => r.json());
        stopBtn.style.display = busy ? 'inline-block' : 'none';
        if (messages && messages.length) {
          messagesContainer.innerHTML = '';
          for (const m of messages) {
            if (m.role === 'user') { addMessage('user', m.text); continue; }
            if (m.role === 'system') { note('↩ ' + m.text); continue; }
            const div = addMessage('assistant', '');
            const steps = document.createElement('div'); steps.className = 'steps';
            for (const st of m.steps || []) { const x = document.createElement('div'); x.textContent = '→ ' + st; steps.appendChild(x); }
            const reply = document.createElement('div'); reply.innerHTML = renderReply(m.text || '');
            div.append(steps, reply);
          }
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
      } catch (e) { /* no history yet */ }
      connectEvents();
    }
    restoreHistory();

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    stopBtn.addEventListener('click', () => fetch(`${ORCHESTRATOR_URL}/stop`, { method: 'POST' }));

    // Voice input: browser speech recognition fills the box and sends when you pause.
    const micBtn = document.getElementById('micBtn');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      micBtn.style.display = 'none';
    } else {
      const rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = true;
      rec.continuous = false;
      rec.onresult = (e) => {
        let t = '';
        for (const r of e.results) t += r[0].transcript;
        messageInput.value = t;
        if (e.results[e.results.length - 1].isFinal) sendMessage();
      };
      rec.onend = () => micBtn.classList.remove('listening');
      rec.onerror = () => micBtn.classList.remove('listening');
      micBtn.addEventListener('click', () => {
        if (micBtn.classList.contains('listening')) { rec.stop(); return; }
        micBtn.classList.add('listening');
        try { rec.start(); } catch { micBtn.classList.remove('listening'); }
      });
    }
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Initial terminal refresh
    refreshTerminals();
    setInterval(refreshTerminals, 3000);
  </script>
</body>
</html>
