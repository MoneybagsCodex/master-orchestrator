<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Orchestrator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e27;
      color: #e0e7ff;
      display: flex;
      height: 100vh;
    }

    .container {
      display: flex;
      width: 100%;
      gap: 1px;
      background: #1a1f2e;
    }

    /* LEFT SIDE: Chat */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0a0e27;
      border-right: 1px solid #312e81;
    }

    .chat-header {
      background: linear-gradient(90deg, #1e3a8a 0%, #1e1b4b 100%);
      border-bottom: 1px solid #3730a3;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .model-selector {
      background: #111318;
      border: 1px solid #312e81;
      border-radius: 6px;
      padding: 8px 12px;
      color: #e0e7ff;
      font-size: 12px;
      cursor: pointer;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .message.user {
      background: #6366f1;
      color: white;
      align-self: flex-end;
      margin-left: 20%;
    }

    .message.agent {
      background: #1e293b;
      border: 1px solid #312e81;
      color: #a5b4fc;
      align-self: flex-start;
      margin-right: 20%;
    }

    .message.agent.decision {
      background: #166534;
      border-color: #22c55e;
      color: #dcfce7;
    }

    .message-timestamp {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 4px;
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid #312e81;
      display: flex;
      gap: 8px;
    }

    .message-input {
      flex: 1;
      background: #111318;
      border: 1px solid #312e81;
      border-radius: 6px;
      padding: 10px 12px;
      color: #e0e7ff;
      font-size: 14px;
    }

    .message-input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .send-btn {
      padding: 10px 24px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .send-btn:hover {
      background: #4f46e5;
    }

    .send-btn:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }

    /* RIGHT SIDE: Dashboard */
    .dashboard-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0a0e27;
    }

    .dashboard-header {
      background: linear-gradient(90deg, #1e3a8a 0%, #1e1b4b 100%);
      border-bottom: 1px solid #3730a3;
      padding: 16px;
    }

    .dashboard-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .mission-info {
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .mission-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .mission-meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 8px;
    }

    .progress-bar {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      height: 24px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-fill {
      background: #10b981;
      height: 100%;
      width: 0%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 600;
      transition: width 0.4s ease;
    }

    .dashboard-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .agent-section {
      background: #1a1f2e;
      border: 1px solid #312e81;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .agent-name {
      font-size: 12px;
      color: #6366f1;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .phase-list {
      font-size: 13px;
      color: #a5b4fc;
      line-height: 1.6;
    }

    .phase-item {
      padding: 6px 0;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .phase-status {
      width: 16px;
      text-align: center;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 40px 16px;
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #111318;
    }

    ::-webkit-scrollbar-thumb {
      background: #312e81;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4c1d95;
    }

    .decision-buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .decision-btn {
      padding: 8px 16px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .decision-btn:hover {
      background: #059669;
    }

    .decision-btn.secondary {
      background: #f59e0b;
    }

    .decision-btn.secondary:hover {
      background: #d97706;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LEFT: Chat Interface -->
    <div class="chat-panel">
      <div class="chat-header">
        <h1>💬 Master Orchestrator</h1>
        <select id="modelSelect" class="model-selector">
          <option value="claude-opus-5-5">Opus 5.5</option>
          <option value="claude-sonnet-5-5">Sonnet 5.5</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
        </select>
      </div>

      <div id="messages" class="messages">
        <div class="message agent">
          <div>👋 Hi! I'm your master orchestration agent. What would you like me to do?</div>
          <div class="message-timestamp" style="opacity: 0.5; font-size: 11px;">Ready to orchestrate</div>
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          class="message-input"
          placeholder="e.g., Deploy v2.1.0 to production"
          autocomplete="off"
        />
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <!-- RIGHT: Dashboard -->
    <div class="dashboard-panel">
      <div class="dashboard-header">
        <h2>📊 Live Execution</h2>
      </div>

      <div style="padding: 16px; flex: 1; overflow-y: auto;">
        <div id="missionInfo" style="display: none;">
          <div class="mission-info">
            <div class="mission-title" id="missionTitle">—</div>
            <div class="mission-meta">
              <span>Risk: <span id="riskLevel">—</span></span>
              <span>Progress: <span id="progress">0%</span></span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
            </div>
          </div>
        </div>

        <div id="agentStatuses"></div>

        <div id="emptyState" class="empty-state">
          Start a mission to see live execution
        </div>
      </div>
    </div>
  </div>

  <script>
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesContainer = document.getElementById('messages');
    const modelSelect = document.getElementById('modelSelect');
    const missionInfo = document.getElementById('missionInfo');
    const emptyState = document.getElementById('emptyState');

    let currentMission = null;
    let statusInterval = null;

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;

      // Display user message
      addMessage('user', message);
      messageInput.value = '';
      sendBtn.disabled = true;

      try {
        // Send command to orchestrator
        const response = await fetch('/api/orchestrator/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            command: message,
            model: modelSelect.value,
          }),
        });

        if (!response.ok) throw new Error('Failed to send command');

        const data = await response.json();

        // Display agent's plan
        if (data.plan) {
          addMessage('agent', data.plan);
        }

        currentMission = data.workflow;
        missionInfo.style.display = 'block';
        emptyState.style.display = 'none';
        document.getElementById('missionTitle').textContent = `🚀 ${message}`;

        // Start polling for updates
        startStatusPolling();
      } catch (error) {
        addMessage('agent', `❌ Error: ${error.message}`);
      } finally {
        sendBtn.disabled = false;
      }
    }

    function addMessage(role, content, isDecision = false) {
      const div = document.createElement('div');
      const className = `message ${role}${isDecision ? ' decision' : ''}`;
      div.className = className;

      const timestamp = new Date().toLocaleTimeString();
      div.innerHTML = `
        <div>${content}</div>
        <div class="message-timestamp">${timestamp}</div>
      `;

      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function startStatusPolling() {
      if (statusInterval) clearInterval(statusInterval);

      statusInterval = setInterval(async () => {
        try {
          const response = await fetch('/api/orchestrator/status');
          if (!response.ok) throw new Error('Status check failed');

          const data = response.json();
          updateDashboard(await data);

          if (data.progress && data.progress.percentComplete === 100) {
            clearInterval(statusInterval);
            fetchAgentResponse();
          }
        } catch (error) {
          console.error('Status polling error:', error);
        }
      }, 1000);
    }

    async function fetchAgentResponse() {
      try {
        const response = await fetch('/api/orchestrator/response');
        if (!response.ok) throw new Error('Failed to fetch response');

        const data = await response.json();
        if (data.message) {
          addMessage('agent', data.message);
        }
      } catch (error) {
        console.error('Response fetch error:', error);
      }
    }

    function updateDashboard(data) {
      if (!data.phases) return;

      // Update progress
      document.getElementById('progress').textContent = data.progress.percentComplete + '%';
      document.getElementById('progressFill').style.width = data.progress.percentComplete + '%';
      document.getElementById('progressFill').textContent = data.progress.percentComplete + '%';

      // Update risk level
      const riskEmoji = data.riskLevel === 'low' ? '🟢' : data.riskLevel === 'medium' ? '🟡' : '🔴';
      document.getElementById('riskLevel').textContent = `${riskEmoji} ${data.riskLevel}`;

      // Update agent statuses
      const agentMap = {};
      for (const phase of data.phases) {
        const agent = phase.assignedAgent || 'Unassigned';
        if (!agentMap[agent]) agentMap[agent] = [];
        agentMap[agent].push(phase);
      }

      const statusesDiv = document.getElementById('agentStatuses');
      statusesDiv.innerHTML = '';

      for (const [agent, phases] of Object.entries(agentMap)) {
        const section = document.createElement('div');
        section.className = 'agent-section';
        section.innerHTML = `
          <div class="agent-name">${agent}</div>
          <div class="phase-list">
            ${phases
              .map((p) => {
                const icon = p.state === 'done' ? '✓' : p.state === 'running' ? '⏳' : p.state === 'ready' ? '⚪' : '⚫';
                return `<div class="phase-item"><div class="phase-status">${icon}</div><div>${p.description}</div></div>`;
              })
              .join('')}
          </div>
        `;
        statusesDiv.appendChild(section);
      }
    }

    // Allow Enter to send
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Add model change notice
    modelSelect.addEventListener('change', () => {
      if (currentMission) {
        addMessage('agent', '📝 Model changed. Start a new mission to use the new model.');
      }
    });

    addMessage('agent', '✓ Connected and ready');
  </script>
</body>
</html>
