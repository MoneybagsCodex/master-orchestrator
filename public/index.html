<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Orchestrator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Menlo, monospace;
      background: #0a0e27;
      color: #e0e7ff;
      display: flex;
      height: 100vh;
    }

    .container {
      display: flex;
      width: 100%;
      gap: 1px;
      background: #1a1f2e;
    }

    /* LEFT: Chat Panel */
    .chat-panel {
      flex: 0 0 40%;
      display: flex;
      flex-direction: column;
      background: #0a0e27;
      border-right: 1px solid #312e81;
    }

    .chat-header {
      background: linear-gradient(90deg, #1e3a8a 0%, #1e1b4b 100%);
      border-bottom: 1px solid #3730a3;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .chat-header h1 {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .model-picker {
      background: #111318;
      border: 1px solid #312e81;
      color: #e0e7ff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    .model-picker:hover {
      border-color: #6366f1;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      word-wrap: break-word;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.user {
      background: #6366f1;
      color: white;
      align-self: flex-end;
      max-width: 85%;
    }

    .message.assistant {
      background: #1e293b;
      border: 1px solid #312e81;
      color: #a5b4fc;
      align-self: flex-start;
      max-width: 85%;
      white-space: pre-wrap;
      font-family: 'Menlo', monospace;
      font-size: 13px;
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid #312e81;
      display: flex;
      gap: 8px;
    }

    .message-input {
      flex: 1;
      background: #111318;
      border: 1px solid #312e81;
      border-radius: 6px;
      padding: 10px 12px;
      color: #e0e7ff;
      font-size: 14px;
      font-family: inherit;
    }

    .message-input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .send-btn {
      padding: 10px 24px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .send-btn:hover:not(:disabled) {
      background: #4f46e5;
    }

    .send-btn:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }

    /* RIGHT: Terminals Panel */
    .terminals-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0a0e27;
      overflow: hidden;
    }

    .terminals-header {
      background: linear-gradient(90deg, #1e3a8a 0%, #1e1b4b 100%);
      border-bottom: 1px solid #3730a3;
      padding: 16px;
    }

    .terminals-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .terminals-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .terminal-panel {
      background: #111318;
      border: 1px solid #312e81;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 200px;
      flex: 1;
    }

    .terminal-header {
      background: #1a1f2e;
      border-bottom: 1px solid #312e81;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #6366f1;
    }

    .terminal-label {
      text-transform: uppercase;
    }

    .terminal-status {
      font-size: 11px;
      color: #a5b4fc;
      opacity: 0.8;
    }

    .terminal-body {
      flex: 1;
      overflow: auto;
      padding: 8px 10px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 260px;
      background: #0a0e27;
      font-family: 'Menlo', monospace;
      font-size: 12px;
    }

    .xterm {
      width: 100%;
      height: 100%;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 40px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #111318;
    }

    ::-webkit-scrollbar-thumb {
      background: #312e81;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4c1d95;
    }

    .streaming {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LEFT: Chat -->
    <div class="chat-panel">
      <div class="chat-header">
        <h1>💬 Master Orchestrator</h1>
        <select id="modelPicker" class="model-picker">
          <option value="claude-opus-5-5">Opus 5.5</option>
          <option value="claude-sonnet-5-5">Sonnet 5.5</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
        </select>
      </div>

      <div id="messagesContainer" class="messages">
        <div class="message assistant">
          👋 Hi! I'm your master orchestration agent. What would you like me to orchestrate?
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          class="message-input"
          placeholder="e.g., Run tests on the main branch"
          autocomplete="off"
        />
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
    </div>

    <!-- RIGHT: Live Terminals -->
    <div class="terminals-panel">
      <div class="terminals-header">
        <h2>📊 Live Terminals</h2>
      </div>

      <div id="terminalsContainer" class="terminals-content">
        <div class="empty-state">
          <div>No terminals running</div>
          <div style="font-size: 12px; margin-top: 8px; opacity: 0.6;">Waiting for agents to start...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesContainer = document.getElementById('messagesContainer');
    const modelPicker = document.getElementById('modelPicker');
    const terminalsContainer = document.getElementById('terminalsContainer');

    const ORCHESTRATOR_URL = 'http://localhost:3003';
    const BRIDGE_URL = 'http://localhost:3002';

    let isStreaming = false;
    const terminals = new Map(); // Map of sid -> {terminal, fitAddon}

    // Add a message to the chat
    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return div;
    }

    // Send a message to the orchestrator
    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message || isStreaming) return;

      addMessage('user', message);
      messageInput.value = '';
      sendBtn.disabled = true;
      isStreaming = true;

      const assistantDiv = addMessage('assistant', '');
      assistantDiv.classList.add('streaming');
      let buffer = '';

      try {
        const response = await fetch(`${ORCHESTRATOR_URL}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, model: modelPicker.value }),
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        // Parse Server-Sent Events
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const dataStr = line.slice(6);
              try {
                const text = JSON.parse(dataStr);
                buffer += text;
                assistantDiv.textContent = buffer;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
              } catch (e) {
                // Skip malformed JSON
              }
            }
          }
        }

        assistantDiv.classList.remove('streaming');
      } catch (error) {
        assistantDiv.textContent = `❌ Error: ${error.message}`;
        assistantDiv.classList.remove('streaming');
      } finally {
        sendBtn.disabled = false;
        isStreaming = false;

        // Refresh terminal list after agent completes
        setTimeout(refreshTerminals, 500);
      }
    }

    // Refresh the list of live terminals
    async function refreshTerminals() {
      try {
        const response = await fetch(`${BRIDGE_URL}/terminals`);
        const data = await response.json();
        const sessions = data.sessions || [];

        // Remove terminals that no longer exist
        for (const [sid, _] of terminals) {
          if (!sessions.find(s => s.sid === sid)) {
            const panel = document.querySelector(`[data-sid="${sid}"]`);
            if (panel) panel.remove();
            terminals.delete(sid);
          }
        }

        // Add/update terminal panels (read-only tails; attaching a WebSocket would
        // evict the same session's panel in the 3001 cockpit)
        for (const session of sessions) {
          if (!terminals.has(session.sid)) {
            createTerminalPanel(session);
          }
          const body = terminals.get(session.sid).body;
          const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 8;
          body.textContent = session.bufferTail;
          if (atBottom) body.scrollTop = body.scrollHeight;
        }

        // Show empty state if no terminals
        if (sessions.length === 0 && terminals.size === 0) {
          terminalsContainer.innerHTML = `
            <div class="empty-state">
              <div>No terminals running</div>
              <div style="font-size: 12px; margin-top: 8px; opacity: 0.6;">Waiting for agents to start...</div>
            </div>
          `;
        }
      } catch (error) {
        console.error('Error refreshing terminals:', error);
      }
    }

    // Create a terminal panel for a session
    function createTerminalPanel(session) {
      const panel = document.createElement('div');
      panel.className = 'terminal-panel';
      panel.setAttribute('data-sid', session.sid);

      const header = document.createElement('div');
      header.className = 'terminal-header';
      header.innerHTML = `
        <div class="terminal-label">${session.label || session.agent || session.sid.slice(0, 8)}</div>
        <div class="terminal-status">${session.sid.slice(0, 8)}</div>
      `;

      const body = document.createElement('div');
      body.className = 'terminal-body';

      panel.appendChild(header);
      panel.appendChild(body);

      // Remove empty state
      const emptyState = terminalsContainer.querySelector('.empty-state');
      if (emptyState) emptyState.remove();

      terminalsContainer.appendChild(panel);

      terminals.set(session.sid, { body });
    }

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Initial terminal refresh
    refreshTerminals();
    setInterval(refreshTerminals, 2000); // Poll every 2 seconds for new terminals
  </script>
</body>
</html>
