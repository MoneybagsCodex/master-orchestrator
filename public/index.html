<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Orchestrator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Menlo, monospace;
      background: #0a0e27;
      color: #e0e7ff;
      display: flex;
      height: 100vh;
    }

    .container {
      display: flex;
      height: 100vh;
      overflow: hidden;
      width: 100%;
      gap: 1px;
      background: #1a1f2e;
    }

    /* LEFT: Chat Panel */
    .chat-panel {
      flex: 0 0 40%;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #0a0e27;
      border-right: 1px solid #312e81;
    }

    .chat-header {
      background: linear-gradient(90deg, #1e3a8a 0%, #1e1b4b 100%);
      border-bottom: 1px solid #3730a3;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .chat-header h1 {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .model-picker {
      background: #111318;
      border: 1px solid #312e81;
      color: #e0e7ff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    .model-picker:hover {
      border-color: #6366f1;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      word-wrap: break-word;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.user {
      background: #6366f1;
      color: white;
      align-self: flex-end;
      max-width: 85%;
    }

    .message.assistant {
      background: #1e293b;
      border: 1px solid #312e81;
      color: #a5b4fc;
      align-self: flex-start;
      max-width: 85%;
      white-space: pre-wrap;
      font-family: 'Menlo', monospace;
      font-size: 13px;
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid #312e81;
      display: flex;
      gap: 8px;
    }

    .message-input {
      flex: 1;
      background: #111318;
      border: 1px solid #312e81;
      border-radius: 6px;
      padding: 10px 12px;
      color: #e0e7ff;
      font-size: 14px;
      font-family: inherit;
    }

    .message-input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .send-btn {
      padding: 10px 24px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .send-btn:hover:not(:disabled) {
      background: #4f46e5;
    }

    .send-btn:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }

    /* RIGHT: Terminals Panel */
    .terminals-panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #0a0e27;
      overflow: hidden;
    }

    .terminals-header {
      background: linear-gradient(90deg, #1e3a8a 0%, #1e1b4b 100%);
      border-bottom: 1px solid #3730a3;
      padding: 16px;
    }

    .terminals-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .terminals-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .terminal-panel {
      background: #111318;
      border: 1px solid #312e81;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: none;
    }

    .terminal-header {
      background: #1a1f2e;
      border-bottom: 1px solid #312e81;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #6366f1;
    }

    .terminal-label {
      text-transform: uppercase;
    }

    .terminal-status {
      font-size: 11px;
      color: #a5b4fc;
      opacity: 0.8;
    }

    .terminal-body {
      flex: 1;
      overflow: auto;
      padding: 8px 10px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 260px;
      background: #0a0e27;
      font-family: 'Menlo', monospace;
      font-size: 12px;
    }

    .xterm {
      width: 100%;
      height: 100%;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 40px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #111318;
    }

    ::-webkit-scrollbar-thumb {
      background: #312e81;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4c1d95;
    }

    .streaming {
      opacity: 0.7;
    }

    .agent-card {
      background: #111318; border: 1px solid #312e81; border-radius: 8px;
      padding: 12px 14px; cursor: pointer; font-size: 13px; line-height: 1.45;
    }
    .agent-card:hover { border-color: #6366f1; }
    .agent-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .agent-top b { font-size: 14px; flex: 1; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .pill { font-size: 11px; border: 1px solid; border-radius: 10px; padding: 1px 8px; }
    .muted { color: #64748b; font-size: 11px; }
    .small { margin-top: 6px; }
    .row { color: #cbd5e1; margin-top: 3px; }
    .row span { color: #64748b; display: inline-block; width: 74px; font-size: 11px; text-transform: uppercase; }
    .blocked { background: rgba(245,158,11,.12); border: 1px solid #f59e0b; color: #fcd34d; border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
    .note { color: #94a3b8; font-size: 12px; margin: 4px 0; }
    .raw { background: #0a0e27; border-radius: 6px; padding: 8px; margin-top: 8px; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }

    .sys-note { align-self: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #312e81; padding-top: 6px; margin-top: 4px; }
    .mission { background: #111318; border: 1px solid #312e81; border-radius: 8px; padding: 10px 14px; font-size: 12px; }
    .mission-line { display: flex; justify-content: space-between; gap: 10px; color: #cbd5e1; margin-bottom: 6px; flex-wrap: wrap; }
    .bar { background: #0a0e27; border-radius: 6px; height: 8px; overflow: hidden; }
    .bar div { background: #10b981; height: 100%; transition: width .4s; }
    .tasks { margin-top: 8px; border-top: 1px solid #1e293b; padding-top: 6px; }
    .task { font-size: 12px; color: #94a3b8; margin-top: 3px; display: flex; gap: 6px; align-items: baseline; }
    .task span { flex: none; } .task em { flex: none; font-style: normal; color: #cbd5e1; }
    .task i { margin-left: auto; font-style: normal; color: #64748b; font-size: 11px; flex: none; }
    .task.waiting em { color: #fcd34d; } .task.stalled em, .task.lost em { color: #f87171; } .task.seen em, .task.reported em { color: #34d399; }
    .agent-card { padding: 8px 11px; }
    .row1 { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .ttl { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row1 .pill { font-size: 10px; padding: 0 7px; flex: none; }
    .badge { font-size: 10px; color: #fcd34d; flex: none; }
    .mini { display: flex; gap: 3px; flex: none; opacity: .55; }
    .agent-card:hover .mini { opacity: 1; }
    .mini button { width: 22px; height: 20px; padding: 0; font-size: 11px; background: #1e293b; color: #cbd5e1; border: 1px solid #312e81; border-radius: 4px; cursor: pointer; }
    .mini button:hover { border-color: #6366f1; color: #fff; }
    .wk { font-size: 12px; color: #e2e8f0; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wk.need { color: #fcd34d; font-weight: 600; }
    .wk.fin { color: #6ee7b7; }
    .wk.fin.pending { color: #64748b; }
    .wk.pending { color: #64748b; font-style: italic; }
    .latest { font-size: 11px; color: #94a3b8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .act { margin: 4px 0 2px; }
    .act .lbl { font-size: 10.5px; color: #9ca3af; display: flex; justify-content: space-between; gap: 6px; }
    .act .lbl b { font-weight: 600; }
    .act .trk { height: 4px; border-radius: 2px; background: #1f2937; overflow: hidden; position: relative; margin-top: 2px; }
    .act .trk i { position: absolute; top: 0; bottom: 0; width: 38%; border-radius: 2px; animation: actslide 1.4s ease-in-out infinite; }
    .act.thinking .trk i { background: #a78bfa; animation-duration: 2.2s; }
    .act.tool .trk i { background: #fbbf24; }
    .act.writing .trk i { background: #34d399; animation-duration: 1.8s; }
    .act.thinking .lbl b { color: #a78bfa; } .act.tool .lbl b { color: #fbbf24; } .act.writing .lbl b { color: #34d399; }
    @keyframes actslide { 0% { left: -40%; } 100% { left: 102%; } }
    .plan { border: 1px solid #312e81; border-radius: 8px; padding: 8px 10px; margin: 8px 0; background: #0f172a; }
    .plan-h { font-size: 11px; font-weight: 600; color: #c7d2fe; display: flex; justify-content: space-between; cursor: pointer; }
    .plan-h .muted { font-weight: 400; }
    .plan svg { width: 100%; height: auto; display: block; margin-top: 6px; }
    .plan .pn rect { fill: #111827; stroke-width: 1.5; }
    .plan .pn text { fill: #e5e7eb; font-size: 10px; }
    .plan .pn.todo rect { stroke: #475569; } .plan .pn.active rect { stroke: #fbbf24; } .plan .pn.done rect { stroke: #34d399; fill: #052e2b; }
    .plan .pn.blocked rect { stroke: #f87171; } .plan .pn.decide rect { stroke: #f59e0b; fill: #3a2a05; stroke-dasharray: 4 2; }
    .plan .pn.active rect { animation: planpulse 1.6s ease-in-out infinite; }
    @keyframes planpulse { 50% { stroke-opacity: .35; } }
    .plan .pe { fill: none; stroke: #475569; stroke-width: 1.2; } .plan .pe.bad { stroke: #f87171; stroke-dasharray: 4 3; }
    .plan .pn.held rect { stroke: #64748b; stroke-dasharray: 2 3; fill: #0b1220; } .plan .pn.held text { fill: #94a3b8; }
    .plan .pn .tag { font-size: 8.5px; fill: #9ca3af; }
    .plan .pdec { margin-top: 6px; font-size: 11px; color: #fcd34d; }
    .tok { font-size: 10.5px; color: #94a3b8; margin: 3px 0 0; display: flex; flex-wrap: wrap; gap: 2px 10px; }
    .tok .ctx.hot { color: #fbbf24; font-weight: 600; } .tok .ctx.hot b { color: #fbbf24; }
    .thresh { font-size: 11px; color: #94a3b8; margin: 4px 0; } .thresh select { background: #111827; color: #e5e7eb; border: 1px solid #334155; border-radius: 4px; font-size: 11px; }
    .errs { margin: 4px 0; padding: 4px 8px; border-left: 3px solid #f87171; background: #2a1215; border-radius: 4px; font-size: 10.5px; color: #fecaca; }
    .errs b { color: #fca5a5; } .errs div { white-space: normal; word-break: break-word; }
    .tok b { color: #cbd5e1; font-weight: 600; }
    .agent-card .doing { margin: 2px 0 0; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agent-card .blocked { margin: 4px 0 0; padding: 3px 7px; font-size: 11px; }
    .stand { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; }
    .stand .sec { display: flex; gap: 6px; font-size: 11px; line-height: 1.35; }
    .stand .ic { flex: none; width: 14px; text-align: center; }
    .stand b { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; color: #64748b; }
    .stand .it { color: #cbd5e1; display: inline; }
    .stand .full .it, .agent-card.open .stand .it { display: block; margin-top: 1px; }
    .stand .more { color: #64748b; display: inline; margin-left: 4px; }
    .agent-card.open .stand .more { display: block; }
    .stand .sec.dec .ic, .stand .sec.dec b { color: #fcd34d; }
    .stand .sec.iss .ic, .stand .sec.iss b { color: #f87171; }
    .stand .sec.don .ic, .stand .sec.don b { color: #34d399; }
    .ar { margin-top: 5px; font-size: 11px; }
    .ar .q { color: #94a3b8; } .ar .q i { color: #64748b; font-style: normal; margin-left: 4px; }
    .ar .r { color: #cbd5e1; margin: 1px 0 0 10px; }
    .ar.waiting .r { color: #fcd34d; } .ar.bad .r { color: #f87171; }
    .foot { margin-top: 6px; border-top: 1px solid #1e293b; padding-top: 5px; }
    .foot .linkbtn { font-size: 11px; }
    .convo { background: #0b1020; border: 1px solid #4338ca; border-radius: 10px; width: min(860px, 94vw); height: 86vh; display: flex; flex-direction: column; overflow: hidden; }
    .convo-h { display: flex; gap: 6px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid #312e81; font-size: 14px; }
    .convo-body { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .more-btn { text-align: center; }
    .cm { font-size: 12.5px; line-height: 1.5; border-radius: 8px; padding: 8px 11px; white-space: pre-wrap; word-break: break-word; position: relative; }
    .cm .ct { float: right; margin-left: 10px; font-style: normal; font-size: 10px; color: #64748b; }
    .cm.user { background: #4338ca; color: #fff; align-self: flex-end; max-width: 85%; }
    .cm.asst { background: #1e293b; border: 1px solid #312e81; color: #cbd5e1; max-width: 92%; }
    .cm .who { display: block; font-size: 10.5px; letter-spacing: .03em; margin-bottom: 3px; }
    /* Standard chat layout, from the agent's side: what comes IN to it (you, the orchestrator, other sessions) is on the
       right like a user message; what the agent says or sends OUT is on the left. */
    .cm.recv { background: #4338ca; border: 1px solid #6366f1; color: #fff; align-self: flex-end; max-width: 85%; }
    .cm.recv .who { color: #c7d2fe; }
    .cm.sent { background: #1e293b; border: 1px dashed #475569; color: #cbd5e1; align-self: flex-start; max-width: 92%; }
    .cm.sent .who { color: #94a3b8; }
    .cm.tool { font-family: Menlo, monospace; font-size: 11px; color: #64748b; padding: 2px 11px; }
    .cm.err { font-family: Menlo, monospace; font-size: 11px; color: #f87171; padding: 2px 11px; }
    .cm.sys { align-self: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #1e293b; padding: 4px 0; max-width: 90%; text-align: center; }
    .stand .it.ck, .agent-card.open .stand .it.ck { display: flex; gap: 6px; align-items: baseline; margin-top: 2px; }
    .stand .chk { color: #34d399; flex: none; font-size: 11px; line-height: 1.35; }
    .stand .tx { min-width: 0; }
    .donelist { max-height: 240px; overflow-y: auto; padding-right: 4px; }
    .stand .it .when { color: #64748b; font-style: normal; font-size: 10px; margin-left: 4px; }
    .reading { color: #fcd34d; font-size: 10px; margin-left: 4px; }
    .moreb { margin-top: 3px; }
    .headline { font-size: 13px; color: #e2e8f0; margin: 2px 0 4px; }
    .doing { font-size: 12px; color: #fcd34d; margin-bottom: 4px; }
    .turns { margin-top: 6px; display: flex; flex-direction: column; gap: 5px; }
    .turn { display: flex; gap: 7px; font-size: 12px; color: #94a3b8; }
    .turn > span { flex: none; width: 14px; text-align: center; color: #6366f1; }
    .turn .asked { color: #cbd5e1; }
    .turn .said { color: #94a3b8; margin-top: 1px; }
    .turn .chips { color: #64748b; font-size: 11px; margin-top: 1px; }
    .turn.live .asked { color: #fcd34d; }
    .turn.loop { color: #94a3b8; } .turn.loop em { font-style: normal; color: #64748b; }
    .qa { display: flex; gap: 6px; align-items: center; margin-top: 8px; border-top: 1px solid #1e293b; padding-top: 8px; }
    .qa button, .need-actions button, .sadd button, .srow button, .linkbtn { background: #1e293b; color: #e0e7ff; border: 1px solid #312e81; border-radius: 5px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
    .qa button:hover, .srow button:hover { border-color: #6366f1; }
    .linkbtn { background: none; border: none; color: #818cf8; padding: 0; text-decoration: underline; }
    .needs { background: rgba(245,158,11,.08); border: 1px solid #f59e0b; border-radius: 8px; padding: 10px 12px; }
    .needs-h { font-size: 12px; font-weight: 600; color: #fcd34d; margin-bottom: 6px; }
    .need { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid rgba(245,158,11,.2); font-size: 12px; color: #e2e8f0; }
    .need:first-of-type { border-top: none; }
    .need .detail { color: #cbd5e1; opacity: .8; margin-top: 2px; word-break: break-word; }
    .need-actions { display: flex; gap: 6px; flex: none; align-items: flex-start; }
    .need-actions .ok { border-color: #10b981; color: #6ee7b7; } .need-actions .no { border-color: #ef4444; color: #fca5a5; }
    .standing { background: #111318; border: 1px solid #312e81; border-radius: 8px; padding: 10px 14px; font-size: 12px; }
    .standing-h { cursor: pointer; font-weight: 600; color: #cbd5e1; }
    .standing-body { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .srow { display: flex; justify-content: space-between; gap: 8px; color: #cbd5e1; align-items: baseline; }
    .sadd { display: flex; gap: 6px; } .sadd input { flex: 1; background: #0a0e27; border: 1px solid #312e81; border-radius: 5px; color: #e0e7ff; padding: 5px 8px; font-size: 12px; }
    #toasts { position: fixed; top: 14px; right: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: 340px; }
    .toast { background: #1e293b; border: 1px solid #312e81; color: #e2e8f0; border-radius: 8px; padding: 9px 12px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    .toast.warn { border-color: #f59e0b; background: #2a2110; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 70; }
    .dialog { background: #111827; border: 1px solid #4338ca; border-radius: 10px; padding: 18px 20px; max-width: 420px; width: 90%; }
    .dialog h3 { font-size: 15px; margin-bottom: 8px; } .dialog p { font-size: 13px; color: #cbd5e1; white-space: pre-wrap; margin-bottom: 14px; line-height: 1.45; }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .dlg-actions button { background: #1e293b; color: #e0e7ff; border: 1px solid #312e81; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
    .dlg-actions .go { background: #4f46e5; border-color: #6366f1; }
    .msg-status { font-size: 10.5px; margin-top: 4px; opacity: .8; text-align: right; }
    .msg-status.pending { opacity: .6; } .msg-status.bad { color: #fecaca; opacity: 1; }
    .working { align-self: flex-start; font-size: 12px; color: #94a3b8; padding: 6px 10px; display: flex; align-items: center; gap: 8px; }
    .dots { display: inline-flex; gap: 3px; } .dots i { width: 5px; height: 5px; border-radius: 50%; background: #818cf8; animation: blink 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    .message.failed { opacity: .55; outline: 1px solid #ef4444; }
    .stale { background: #7c2d12; color: #fed7aa; text-align: center; padding: 8px 12px; font-size: 13px; position: fixed; top: 0; left: 0; right: 0; z-index: 80; }
    .steps {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .steps:empty { display: none; }
    .message.assistant code {
      background: #0f172a;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .mic-btn {
      padding: 10px 12px;
      background: #1e293b;
      color: #e0e7ff;
      border: 1px solid #312e81;
      border-radius: 6px;
      cursor: pointer;
    }
    .mic-btn.listening { background: #dc2626; border-color: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <!-- LEFT: Chat -->
    <div class="chat-panel">
      <div class="chat-header">
        <h1>💬 Master Orchestrator <span id="liveDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#64748b;margin-left:6px;vertical-align:middle"></span></h1>
        <select id="modelPicker" class="model-picker">
          <option value="claude-haiku-4-5-20251001" selected>Haiku 4.5</option>
          <option value="claude-sonnet-5-5">Sonnet 5.5</option>
          <option value="claude-opus-5-5">Opus 5.5</option>
        </select>
      </div>

      <div id="messagesContainer" class="messages">
        <div class="message assistant">
          👋 Hi! I'm your master orchestration agent. What would you like me to orchestrate?
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          class="message-input"
          placeholder="e.g., Run tests on the main branch"
          autocomplete="off"
        />
        <button class="mic-btn" id="micBtn" title="Dictate (click, speak, it sends when you pause)">🎤</button>
        <button class="mic-btn" id="stopBtn" style="display:none" title="Stop the task the orchestrator is working on">■ Stop</button>
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
    </div>

    <!-- RIGHT: Live Terminals -->
    <div class="terminals-panel">
      <div class="terminals-header">
        <h2>🧭 Your agents</h2>
      </div>

      <div id="terminalsContainer" class="terminals-content">
        <div class="empty-state">
          <div>No terminals running</div>
          <div style="font-size: 12px; margin-top: 8px; opacity: 0.6;">Waiting for agents to start...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const messagesContainer = document.getElementById('messagesContainer');
    const modelPicker = document.getElementById('modelPicker');
    const terminalsContainer = document.getElementById('terminalsContainer');

    const ORCHESTRATOR_URL = 'http://localhost:3003';
    // Terminal list comes via the orchestrator, which merges in cockpit labels (older bridges lack them).
    const BRIDGE_URL = ORCHESTRATOR_URL;

    const terminals = new Map(); // Map of sid -> {terminal, fitAddon}

    // Add a message to the chat
    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return div;
    }

    // Escape, then apply the little markdown the orchestrator uses (bold, inline code).
    function renderReply(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    // ---- Chat: driven by the orchestrator's live event stream (/events) ----
    let currentBubble = null;   // assistant bubble being filled for the current turn
    let replyDiv = null, stepsDiv = null, replyText = '';
    let lastSeq = 0;

    function ensureBubble() {
      if (currentBubble) return;
      currentBubble = addMessage('assistant', '');
      stepsDiv = document.createElement('div'); stepsDiv.className = 'steps';
      replyDiv = document.createElement('div');
      currentBubble.append(stepsDiv, replyDiv);
      replyText = '';
    }
    function note(text, cls) {
      const n = document.createElement('div');
      n.className = 'sys-note' + (cls ? ' ' + cls : '');
      n.textContent = text;
      messagesContainer.appendChild(n);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    const NOTICE_TEXT = {
      held: '⏸ A message is on hold: the agent\'s user has to approve it before the agent sees it',
      released: '▶ Held message approved and delivered',
      denied: '✕ A held message was denied',
      expired: '⌛ A held message expired without being delivered',
      refused: '✕ An agent refused cross-session messages',
    };

    function handleEvent(e) {
      lastSeq = Math.max(lastSeq, e.seq || 0);
      if (e.kind === 'user') {
        if (pendingEcho !== null && e.text === pendingEcho) pendingEcho = null; else { addMessage('user', e.text); }
        currentBubble = null; stopBtn.style.display = 'inline-block';
      }
      else if (e.kind === 'tool') {
        ensureBubble();
        const s = document.createElement('div'); s.textContent = '→ ' + e.command; stepsDiv.appendChild(s);
      } else if (e.kind === 'text') {
        if (workingRow) { workingQueued = false; paintWorking(); }
        ensureBubble();
        replyText += (replyText ? '\n\n' : '') + e.text;
        replyDiv.innerHTML = renderReply(replyText);
      } else if (e.kind === 'turn') {
        if (e.state === 'start') stopBtn.style.display = 'inline-block';
        else { stopBtn.style.display = 'none'; currentBubble = null; hideWorking(); finishAwaiting(true); }
      } else if (e.kind === 'peer') {
        note('↩ Message from ' + (e.fromName || 'an agent') + ': ' + e.text.slice(0, 180));
        currentBubble = null;
      } else if (e.kind === 'notice') {
        if (e.state === 'idle') note('✓ ' + (e.text.match(/^"([^"]+)"/)?.[1] || 'An agent') + ' finished what it was doing');
        else if (e.state === 'sent') {
          const ag = (lastStatus?.agents || []).find((x) => x.peer === e.text || x.name === e.text);
          note('⏳ Sent to ' + (ag ? `“${ag.topic || ag.label}”` : e.text) + ': waiting for its reply');
        } else note(NOTICE_TEXT[e.state] || e.text);
      } else if (e.kind === 'notify') {
        toast(`${e.title}: ${e.text}`.slice(0, 220), e.level);
        try { if (window.Notification && Notification.permission === 'granted') new Notification(e.title, { body: e.text }); } catch (err) { /* ignore */ }
      } else if (e.kind === 'error') {
        ensureBubble(); replyDiv.textContent = '❌ ' + e.text; currentBubble = null; stopBtn.style.display = 'none'; hideWorking(); finishAwaiting(false);
      }
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      refreshSoon();
    }

    let es = null;
    function connectEvents() {
      if (es) es.close();
      es = new EventSource(`${ORCHESTRATOR_URL}/events` + (lastSeq ? `?since=${lastSeq}` : ''));
      es.onmessage = (m) => { try { handleEvent(JSON.parse(m.data)); } catch (err) { /* ignore */ } };
      es.onerror = () => { es.close(); setTimeout(connectEvents, 1500); };   // reconnect, replaying what we missed
    }
    let refreshTimer = null;
    function refreshSoon() { clearTimeout(refreshTimer); refreshTimer = setTimeout(refreshTerminals, 600); }

    // Send a message. The bubble appears at once with a live delivery status under it:
    //   Sending… → ✓ Received → (Queued behind the current task →) Working on it… → ✓ Replied
    // and a failed send puts your text back in the box with a warning instead of losing it silently.
    let pendingEcho = null;
    const awaiting = [];          // bubbles of messages sent and not yet answered
    let workingRow = null, workingTimer = null, workingSince = 0, workingQueued = false;

    function setStatus(bubble, text, cls) {
      let st = bubble.querySelector('.msg-status');
      if (!st) { st = document.createElement('div'); st.className = 'msg-status'; bubble.appendChild(st); }
      st.textContent = text; st.className = 'msg-status ' + (cls || '');
    }
    function showWorking(queued) {
      workingQueued = queued;
      if (!workingRow) {
        workingRow = document.createElement('div'); workingRow.className = 'working';
        messagesContainer.appendChild(workingRow); workingSince = Date.now();
        workingTimer = setInterval(paintWorking, 1000);
      } else messagesContainer.appendChild(workingRow);   // keep it at the bottom
      paintWorking(); messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    function paintWorking() {
      if (!workingRow) return;
      const secs = Math.round((Date.now() - workingSince) / 1000);
      workingRow.innerHTML = `<span class="dots"><i></i><i></i><i></i></span> ${workingQueued ? 'Queued: the orchestrator is finishing something else first' : 'Orchestrator is working on it'}${secs >= 8 ? ` · ${secs}s` : ''}${secs >= 25 ? ' · still going, long tasks can take a minute' : ''}`;
    }
    function hideWorking() { if (workingRow) { workingRow.remove(); workingRow = null; clearInterval(workingTimer); } }
    function finishAwaiting(ok) { while (awaiting.length) setStatus(awaiting.shift(), ok ? '✓ Replied' : '', ok ? 'ok' : ''); }

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;
      messageInput.value = '';
      pendingEcho = message;
      const bubble = addMessage('user', message);
      setStatus(bubble, 'Sending…', 'pending');
      currentBubble = null;
      if (!es || es.readyState !== 1) note('⚠ Live connection is down: reconnecting. Your message is still being sent.');
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 10000);
      try {
        const r = await fetch(`${ORCHESTRATOR_URL}/chat`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Orch-UI': '3' }, signal: ctl.signal,
          body: JSON.stringify({ message, model: modelPicker.value }),
        });
        if (!r.ok) throw new Error('server answered ' + r.status);
        const info = await r.json().catch(() => ({}));
        setStatus(bubble, info.queued ? '✓ Received · queued behind the current task' : '✓ Received · working on it…', 'ok');
        awaiting.push(bubble);
        showWorking(!!info.queued);
      } catch (err) {
        pendingEcho = null;
        bubble.classList.add('failed');
        setStatus(bubble, '✕ Not sent', 'bad');
        if (!messageInput.value) messageInput.value = message;
        note('❌ Not sent (' + (err.name === 'AbortError' ? 'no answer from the orchestrator after 10s' : err.message) + '). Your text is back in the box: try again.');
      } finally { clearTimeout(timer); }
    }

    // Header light: green when the live stream is connected, and a warning if this page is older than the server.
    const UI_VERSION = 3;
    function paintLive() { const d = document.getElementById('liveDot'); if (d) { const ok = es && es.readyState === 1; d.style.background = ok ? '#10b981' : '#f59e0b'; d.title = ok ? 'Live connection to the orchestrator' : 'Reconnecting…'; } }
    setInterval(paintLive, 1000);
    fetch(`${ORCHESTRATOR_URL}/health`).then((r) => r.json()).then((h) => {
      if (h.ui && h.ui !== UI_VERSION) { const b = document.createElement('div'); b.className = 'stale'; b.textContent = 'This page is out of date. Refresh it (Cmd+Shift+R) so sending and replies work.'; document.body.prepend(b); }
    }).catch(() => {});

    // ---- Right panel: needs-you lane, one tile per agent, standing instructions ----
    const STATE_STYLE = {
      WORKING: ['#10b981', 'Working'], IDLE: ['#64748b', 'Idle'],
      BLOCKED: ['#f59e0b', 'Needs your decision'], UNKNOWN: ['#64748b', 'Unknown'],
    };
    const MSG_STATE = {
      sent: ['⏳', 'sent, awaiting reply', 'waiting'], released: ['▶', 'delivered, awaiting reply', 'waiting'],
      held: ['⏸', 'on hold: needs approval in its terminal', 'waiting'], answered: ['✓', 'answered', 'seen'],
      denied: ['✕', 'denied', 'stalled'], expired: ['⌛', 'expired', 'stalled'], refused: ['✕', 'refused', 'stalled'],
    };
    const TASK_LABEL = { waiting: ['⏳', 'waiting for reply'], seen: ['✓', 'answered'], reported: ['✓', 'answered'], stalled: ['⚠', 'no reply'], lost: ['?', 'lost track'] };
    const expanded = new Set();   // tiles opened to full detail
    const rawOpen = new Set();    // tiles showing the raw screen
    const esc = (t) => String(t ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const ago = (s) => s == null ? '' : s < 5 ? 'just now' : s < 90 ? `${s}s ago` : s < 5400 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`;
    let standingOpen = false;
    let lastStatus = null;

    function toolChips(tools) {
      const e = Object.entries(tools || {}).map(([k, v]) => `${k.replace(/^mcp__[^_]+__/, '')}×${v}`);
      return e.length ? e.slice(0, 4).join(' · ') : '';
    }

    function turnRow(t) {
      if (t.loop) return `<div class="turn loop"><span>🔁</span><div><b>Goal loop ×${t.loop.count}</b> <em>${esc(t.loop.goal.slice(0, 90))}</em></div></div>`;
      const chips = [toolChips(t.tools), t.files.length ? '✎ ' + t.files.slice(0, 3).join(', ') : '', t.errors ? `⚠ ${t.errors} error${t.errors > 1 ? 's' : ''}` : ''].filter(Boolean).join('  ·  ');
      return `<div class="turn ${t.inProgress ? 'live' : ''}"><span>${t.inProgress ? '⏳' : '›'}</span><div>
        <div class="asked">${esc(t.asked.slice(0, 110))}</div>
        ${t.said && !t.inProgress ? `<div class="said">${esc(t.said.slice(0, 150))}</div>` : ''}
        ${chips ? `<div class="chips">${esc(chips)}</div>` : ''}</div></div>`;
    }

    function doneSection(a, dl, full) {
      const shown = full ? dl.items : dl.items.slice(0, 3);
      const more = full ? 0 : dl.total - shown.length;
      const rows = shown.map((x) => `<div class="it ck"><span class="chk">✓</span><span class="tx">${esc(x.text)} <i class="when">${ago(Math.round(Date.now() / 1000 - x.at))}</i></span></div>`).join('');
      return `<div class="sec don"><span class="ic" title="Done">✓</span><div style="min-width:0;flex:1"><b>Done · ${dl.total}</b>${dl.of > dl.read ? `<span class="reading"> reading history ${dl.read}/${dl.of}…</span>` : ''}
        ${full ? `<div class="donelist">${rows}</div>` : rows}
        ${more > 0 ? `<div class="more">+${more} more</div>` : ''}
</div></div>`;
    }

    // Where the agent stands (model-written from its recent exchanges): decisions pending, issues, completed items.
    function standBlock(a, full) {
      const st = a.stand;
      const dec = [...(a.state === 'BLOCKED' ? ['Approve or deny a permission prompt'] : []), ...((st && st.decisions) || [])];
      if (!st && !dec.length) return '<div class="stand muted">Working out where it stands…</div>';
      const sec = (icon, label, items, cls) => {
        if (!items.length) return '';
        const shown = full ? items : items.slice(0, 1), more = full ? 0 : items.length - 1;
        return `<div class="sec ${cls}"><span class="ic" title="${label}">${icon}</span><div><b>${label}</b>${shown.map((x) => cls === 'don' ? `<div class="it ck"><span class="chk">✓</span><span class="tx">${esc(x)}</span></div>` : `<div class="it">${esc(x)}</div>`).join('')}${more > 0 ? `<div class="more">+${more} more</div>` : ''}</div></div>`;
      };
      const dl = a.doneLog && a.doneLog.items && a.doneLog.items.length ? a.doneLog : null;
      // Done is a running ledger of the whole session; until it has filled in, fall back to the recent-window list.
      const doneHtml = dl ? doneSection(a, dl, full) : sec('✓', 'Done', (st && st.done) || [], 'don');
      const html = sec('⚖', 'Decide', dec, 'dec') + sec('⚠', 'Issues', (st && st.issues) || [], 'iss') + doneHtml;
      return `<div class="stand">${html || '<div class="muted">Nothing pending and no known issues.</div>'}</div>`;
    }

    // What you asked an agent and what it said back (not a bare "answered" tick).
    function askRow(text, state, reply, sentAt) {
      const t = ago(Math.round(Date.now() / 1000 - sentAt));
      const ask = `<div class="q">You asked: ${esc(String(text).slice(0, 110))} <i>${t}</i></div>`;
      if (['sent', 'released', 'waiting'].includes(state)) return `<div class="ar waiting">${ask}<div class="r">⏳ waiting for its reply</div></div>`;
      if (state === 'held') return `<div class="ar waiting">${ask}<div class="r">⏸ on hold: needs approval in its terminal</div></div>`;
      if (['denied', 'expired', 'refused', 'stalled', 'lost'].includes(state)) return `<div class="ar bad">${ask}<div class="r">✕ ${state === 'stalled' || state === 'lost' ? 'no reply' : state}</div></div>`;
      return `<div class="ar">${ask}${reply ? `<div class="r">↳ ${esc(String(reply).slice(0, 200))}</div>` : ''}</div>`;
    }

    const fmtTok = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
    let ctxThreshold = 150000;
    try { const v = Number(localStorage.getItem('ctxThreshold')); if (v >= 10000) ctxThreshold = v; } catch { /* storage unavailable */ }
    function errBlock(a) {
      const e = a.recentErrors || []; if (!e.length) return '';
      return `<div class="errs" title="Taken verbatim from the agent's transcript, not summarized"><b>Recent tool errors</b>${e.map((x) => `<div>${esc(x.text)}</div>`).join('')}</div>`;
    }
    function tokLine(a) {
      const t = a.tokens; if (!t || !t.messages) return '';
      return `<div class="tok" title="From the agent's own transcript. Input includes cache writes; cache reads are the re-read conversation, counted in total. Rate is the last 60 minutes.">
        ${t.compactedAt && !t.context ? `<span class="ctx" title="The conversation was just compacted; the new size appears after the agent's next reply">✓ compacted ${ago(Math.max(0, Date.now() / 1000 - t.compactedAt))}, new size after its next reply</span>` : ''}${t.context ? `<span class="ctx ${t.context > ctxThreshold ? 'hot' : ''}" title="Size of the conversation the agent re-reads on every step (latest call: input + cache)">${t.context > ctxThreshold ? '⚠ ' : ''}context <b>${fmtTok(t.context)}</b>${t.context > ctxThreshold ? ` &gt; ${fmtTok(ctxThreshold)}: consider compacting` : ''}</span>` : ''}<span>in <b>${fmtTok(t.input)}</b></span><span>out <b>${fmtTok(t.output)}</b></span><span>cache read <b>${fmtTok(t.cacheRead)}</b></span>
        <span>total <b>${fmtTok(t.total)}</b></span><span><b>${fmtTok(t.perHour)}</b>/hr</span>${a.state === 'WORKING' ? `<span>this turn <b>${fmtTok(t.turnTotal)}</b></span>` : ''}</div>`;
    }

    function actBar(a) {
      const x = a.activity;
      if (!x || a.state !== 'WORKING') return '';
      const label = x.phase === 'tool' ? `running ${esc(x.tool || 'a tool')}` : x.phase === 'writing' ? 'writing a reply' : 'thinking';
      const secs = x.turnStart ? Math.max(0, Math.round(Date.now() / 1000 - x.turnStart)) : 0;
      const t = secs >= 60 ? `${Math.floor(secs / 60)}m ${secs % 60}s` : `${secs}s`;
      // A real percentage exists only when the plan assigns steps to this agent: done steps / its steps.
      const mine = (planData && planData.nodes || []).filter((n) => n.sid && a.sid.startsWith(n.sid));
      if (mine.length) {
        const dn = mine.filter((n) => n.status === 'done').length, pc = Math.round((dn / mine.length) * 100);
        return `<div class="act ${x.phase}"><div class="lbl"><b>${label}</b><span>${pc}% · ${dn}/${mine.length} plan steps · ${t}</span></div><div class="trk"><div style="width:${pc}%;height:100%;background:#34d399"></div></div></div>`;
      }
      return `<div class="act ${x.phase}"><div class="lbl"><b>${label}</b><span>${x.steps} step${x.steps === 1 ? '' : 's'} · ${t}</span></div><div class="trk"><i></i></div></div>`;
    }

    function agentCard(a) {
      const [color, name] = STATE_STYLE[a.state] || STATE_STYLE.UNKNOWN;
      const open = expanded.has(a.sid);
      const turns = (a.turns || []).slice(-4);
      const real = [...turns].reverse().find((t) => !t.loop && t.asked);
      const latest = turns[turns.length - 1];
      // Working: the goal. Finished (idle, and not a goal-loop agent that restarts itself): what it accomplished.
      // Both are model-written summaries; until one is ready show the literal text, muted.
      const idleNotLoop = a.state === 'IDLE' && !a.hasGoalLoop;
      const finished = idleNotLoop && (a.outcome || a.lastSaid);
      let working = '';
      if (a.state === 'BLOCKED') working = `<div class="wk need">⚠ Waiting For You: ${esc(a.prompt ? 'a permission prompt, ' + a.prompt.slice(0, 70) : 'a permission prompt (approve or deny)')}</div>`;
      else if (idleNotLoop && a.asking) working = `<div class="wk need">❓ Waiting For You: ${esc(a.asking.slice(0, 110))}</div>`;
      else if (finished) working = a.outcome ? `<div class="wk fin">✓ Finished: ${esc(a.outcome)}</div>` : `<div class="wk fin pending">✓ Finished: ${esc(a.lastSaid.slice(0, 80))}…</div>`;
      else if (a.headline) working = `<div class="wk">Working on: ${esc(a.headline)}</div>`;
      else if (real) working = `<div class="wk pending">${esc(real.asked.slice(0, 80))}…</div>`;
      const mini = `<span class="mini"><button data-act="compact" data-sid="${esc(a.sid)}" title="Compact its context">⇣</button><button data-act="retest" data-sid="${esc(a.sid)}" title="Ask it to re-run its tests">↻</button><button data-act="stop" data-sid="${esc(a.sid)}" title="Interrupt what it is doing">■</button></span>`;
      const msgs = (a.messages || []).map((m) => askRow(m.text, m.state, m.reply, m.sentAt));
      const tasks = (a.tasks || []).map((t) => askRow(t.text, t.status, t.reply, t.sentAt));
      const pendingMsgs = (a.messages || []).filter((m) => m.state === 'sent' || m.state === 'released' || m.state === 'held').length;
      const oneLine = latest ? (latest.loop ? `🔁 Goal loop ×${latest.loop.count}` : `› ${esc((latest.said || latest.asked).slice(0, 110))}`) : '';
      return `<div class="agent-card ${open ? 'open' : ''}" data-sid="${esc(a.sid)}">
        <div class="row1"><span class="dot" style="background:${color}"></span><b class="ttl">${esc(a.topic || a.label)}</b>
          <span class="pill" style="color:${color};border-color:${color}">${name}</span>${pendingMsgs ? `<span class="badge" title="Messages sent to it that are still unanswered">${pendingMsgs} ⏳</span>` : ''}${mini}</div>
        ${working}
        ${actBar(a)}
        ${tokLine(a)}
        ${errBlock(a)}
        ${a.doing && !open ? `<div class="doing">⏳ ${esc(a.doing)}</div>` : ''}
        ${standBlock(a, open)}
        ${open ? `
          ${a.doing ? `<div class="doing">⏳ now: ${esc(a.doing)}</div>` : ''}
          ${a.hasGoalLoop ? `<div class="note">Has a /goal loop${a.goal ? ` (“${esc(a.goal.slice(0, 90))}”)` : ''}: it restarts itself when idle, so it may flicker.</div>` : ''}
          ${msgs.length || tasks.length ? `<div class="tasks">${msgs.join('')}${tasks.join('')}</div>` : ''}
          <div class="muted small">id ${esc(a.sid.slice(0, 8))} · panel label “${esc(a.label)}” (labels can be wrong) · ${ago(a.secondsSinceActivity)}
            · <button class="linkbtn" data-raw-toggle="${esc(a.sid)}">${rawOpen.has(a.sid) ? 'hide' : 'show'} raw screen</button></div>
          ${rawOpen.has(a.sid) ? `<pre class="raw" data-raw="${esc(a.sid)}">loading…</pre>` : ''}` : ''}
        <div class="foot"><button class="linkbtn" data-convo="${esc(a.sid)}" data-title="${esc(a.topic || a.label)}">📄 Full conversation</button></div>
      </div>`;
    }

    function needsLane(items) {
      if (!items.length) return '';
      return `<div class="needs"><div class="needs-h">Needs you · ${items.length}</div>${items.map((n) => `
        <div class="need ${n.kind}"><div><b>${esc(n.title)}</b><div class="detail">${esc(n.detail)}</div></div>
        <div class="need-actions">${n.actions.includes('approve') ? `<button class="ok" data-decide="approve" data-id="${esc(n.id)}" data-title="${esc(n.title)}" data-detail="${esc(n.detail)}">Approve</button>` : ''}
        ${n.actions.includes('deny') ? `<button class="no" data-decide="deny" data-id="${esc(n.id)}" data-title="${esc(n.title)}" data-detail="${esc(n.detail)}">Deny</button>` : ''}</div></div>`).join('')}</div>`;
    }

    let planData = null, planOpen = true;
    function planPanel(agents) {
      const pl = planData; if (!pl || !pl.nodes || !pl.nodes.length) return '';
      // A node tied to an agent follows that agent's real state, so the graph never claims more than the agents report.
      const live = (n) => {
        const a = n.sid && agents.find((x) => x.sid.startsWith(n.sid));
        if (a && n.status !== 'done' && n.status !== 'decide' && n.status !== 'blocked') { if (a.state === 'BLOCKED') return 'blocked'; if (a.state === 'WORKING') return 'active'; }
        return n.status;
      };
      const nodes = pl.nodes.map((n) => ({ ...n, st: live(n) }));
      const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
      const depth = (n, seen = new Set()) => { if (n.d !== undefined) return n.d; if (seen.has(n.id)) return 0; seen.add(n.id); return (n.d = n.deps.length ? 1 + Math.max(...n.deps.map((d) => byId[d] ? depth(byId[d], seen) : -1)) : 0); };
      nodes.forEach((n) => depth(n));
      // A blocked step holds every step downstream of it: they cannot proceed until it clears.
      const holdBy = (n, seen = new Set()) => { if (seen.has(n.id)) return null; seen.add(n.id); for (const d of n.deps) { const p = byId[d]; if (!p) continue; if (p.st === 'blocked') return p; const up = holdBy(p, seen); if (up) return up; } return null; };
      nodes.forEach((n) => { if (n.st !== 'done') { const b = holdBy(n); if (b && n.st !== 'blocked') { n.held = b; } } });
      const ownerOf = (n) => { const a = n.sid && agents.find((x) => x.sid.startsWith(n.sid)); return a ? (a.topic || a.label) : ''; };
      const clock = (n) => { const t = n.st === 'done' && n.startedAt && n.doneAt ? n.doneAt - n.startedAt : n.statusAt ? Date.now() / 1000 - n.statusAt : 0;
        if (!t || t < 1) return ''; const m = Math.floor(t / 60); return (n.st === 'done' ? 'took ' : n.st === 'todo' ? 'queued ' : '') + (m ? `${m}m` : `${Math.round(t)}s`); };
      const cols = []; nodes.forEach((n) => (cols[n.d] = cols[n.d] || []).push(n));
      const W = 150, H = 48, GX = 26, GY = 12, PAD = 6;
      const rows = Math.max(...cols.map((c) => c.length));
      const width = cols.length * W + (cols.length - 1) * GX + PAD * 2, height = rows * H + (rows - 1) * GY + PAD * 2;
      cols.forEach((c, ci) => c.forEach((n, ri) => { n.x = PAD + ci * (W + GX); n.y = PAD + ri * (H + GY) + ((rows - c.length) * (H + GY)) / 2; }));
      const edges = nodes.flatMap((n) => n.deps.filter((d) => byId[d]).map((d) => { const a = byId[d];
        const x1 = a.x + W, y1 = a.y + H / 2, x2 = n.x, y2 = n.y + H / 2, mx = (x1 + x2) / 2;
        return `<path class="pe ${a.st === 'blocked' ? 'bad' : ''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" marker-end="url(#arr)"/>`; }));
      const clip = (t, k) => (t.length > k ? t.slice(0, k - 1) + '…' : t);
      const boxes = nodes.map((n) => {
        const mark = n.st === 'done' ? '✓ ' : n.st === 'decide' ? '? ' : n.st === 'blocked' ? '! ' : '';
        const l1 = clip(mark + n.title, 26), who = ownerOf(n), meta = [n.held ? 'held by ' + n.held.id : n.st, who && clip(who, 14), clock(n)].filter(Boolean).join(' · ');
        return `<g class="pn ${n.held ? 'held' : n.st}" transform="translate(${n.x},${n.y})"><title>${esc(n.title)}${n.note ? ' — ' + esc(n.note) : ''} [${n.held ? 'waiting: blocked by ' + n.held.title : n.st}]${who ? ' · owner: ' + esc(who) : ''}</title><rect width="${W}" height="${H}" rx="6"/>
          <text x="7" y="19">${esc(l1)}</text><text class="tag" x="7" y="36">${esc(clip(meta, 34))}</text></g>`; }).join('');
      const done = nodes.filter((n) => n.st === 'done').length, decide = nodes.filter((n) => n.st === 'decide'), blockedN = nodes.filter((n) => n.st === 'blocked'), heldN = nodes.filter((n) => n.held);
      return `<div class="plan"><div class="plan-h" data-toggle-plan><span>Plan: ${esc(pl.title)}</span><span class="muted">${done}/${nodes.length} done ${planOpen ? '▾' : '▸'}</span></div>
        ${planOpen ? `<svg viewBox="0 0 ${width} ${height}"><defs><marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#475569"/></marker></defs>${edges.join('')}${boxes}</svg>
        ${blockedN.map((n) => `<div class="pdec" style="color:#fca5a5">⛔ Blocked: ${esc(n.title)}${n.note ? ' · ' + esc(n.note) : ''}${heldN.filter((h) => h.held === n).length ? ` — holding up ${heldN.filter((h) => h.held === n).length} step(s)` : ''}</div>`).join('')}${decide.map((n) => `<div class="pdec">❓ To decide: ${esc(n.title)}${n.note ? ' · ' + esc(n.note) : ''}</div>`).join('')}` : ''}</div>`;
    }

    function summaryStrip(st) {
      const sm = st.summary || { total: 0, waiting: 0, replied: 0, stalled: 0, held: 0 };
      const pct = sm.total ? Math.round((sm.replied / sm.total) * 100) : 0;
      return `<div class="mission"><div class="mission-line"><b>Messages to agents, last hour</b>
        <span>${sm.replied} of ${sm.total} answered · ${sm.waiting} waiting${sm.held ? ` · ${sm.held} on hold` : ''}${sm.stalled ? ` · ${sm.stalled} problem${sm.stalled > 1 ? 's' : ''}` : ''}</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
        <div class="thresh">Flag agents whose context exceeds <select id="ctxThresh">${[100000, 150000, 200000, 300000, 500000].map((v) => `<option value="${v}" ${v === ctxThreshold ? 'selected' : ''}>${fmtTok(v)}</option>`).join('')}</select> tokens</div></div>`;
    }

    let standingList = [];
    function standingPanel() {
      return `<div class="standing"><div class="standing-h" data-toggle-standing>Standing instructions · ${standingList.length} <span class="muted">${standingOpen ? '▾' : '▸'}</span></div>
        ${standingOpen ? `<div class="standing-body">
          ${standingList.map((x) => `<div class="srow"><span>${esc(x.text)}</span><button data-del-standing="${esc(x.id)}">remove</button></div>`).join('') || '<div class="muted">None yet. Example: “Tell me as soon as the car agent has the loan numbers.”</div>'}
          <div class="sadd"><input id="standingInput" placeholder="Add an instruction the orchestrator should keep applying" /><button id="standingAdd">Add</button></div>
          <div class="muted" style="margin-top:6px"><button id="enableAlerts" class="linkbtn">Enable desktop alerts</button></div></div>` : ''}</div>`;
    }

    // ---- Full conversation viewer ----
    async function openConversation(sid, title) {
      const ov = document.createElement('div'); ov.className = 'overlay';
      ov.innerHTML = `<div class="convo"><div class="convo-h"><b>${esc(title)}</b> <span class="muted">· full conversation</span>
        <span style="margin-left:auto"><button class="linkbtn" data-c="refresh">refresh</button> · <button class="linkbtn" data-c="close">close</button></span></div>
        <div class="convo-body"><div class="muted" style="padding:12px">Loading…</div></div></div>`;
      document.body.appendChild(ov);
      const body = ov.querySelector('.convo-body');
      let start = 0, total = 0;
      const clock = (at) => at ? new Date(at * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      const itemHtml = (it) => {
        const t = `<i class="ct">${clock(it.at)}</i>`;
        if (it.role === 'user') return `<div class="cm user">${t}${esc(it.text)}</div>`;
        if (it.role === 'assistant') return `<div class="cm asst">${t}${renderReply(it.text)}</div>`;
        if (it.role === 'recv') return `<div class="cm recv">${t}<b class="who">From ${esc(it.who)}</b>${esc(it.text)}</div>`;
        if (it.role === 'sent') return `<div class="cm sent">${t}<b class="who">Sent to ${esc(it.who)}</b>${esc(it.text)}</div>`;
        if (it.role === 'tool') return `<div class="cm tool">${t}→ ${esc(it.text)}</div>`;
        if (it.role === 'error') return `<div class="cm err">${t}${esc(it.text)}</div>`;
        return `<div class="cm sys">${t}${esc(it.text)}</div>`;
      };
      async function load(before) {
        const url = `${ORCHESTRATOR_URL}/conversation/${encodeURIComponent(sid)}?limit=150` + (before !== undefined ? `&before=${before}` : '');
        const d = await fetch(url).then((r) => r.json());
        if (!d.ok) { body.innerHTML = `<div class="muted" style="padding:12px">${esc(d.message || 'Could not load the conversation.')}</div>`; return null; }
        return d;
      }
      async function first() {
        const d = await load(); if (!d) return;
        start = d.start; total = d.total;
        body.innerHTML = (start > 0 ? `<div class="more-btn"><button class="linkbtn" data-c="earlier">Load earlier (${start} more)</button></div>` : '')
          + d.items.map(itemHtml).join('') || '<div class="muted" style="padding:12px">Nothing recorded yet.</div>';
        body.scrollTop = body.scrollHeight;
      }
      ov.addEventListener('click', async (e) => {
        const c = e.target.closest('[data-c]')?.dataset.c;
        if (e.target === ov || c === 'close') { ov.remove(); return; }
        if (c === 'refresh') { await first(); return; }
        if (c === 'earlier') {
          const d = await load(start); if (!d) return;
          const prevH = body.scrollHeight; start = d.start;
          body.querySelector('.more-btn')?.remove();
          body.insertAdjacentHTML('afterbegin', (start > 0 ? `<div class="more-btn"><button class="linkbtn" data-c="earlier">Load earlier (${start} more)</button></div>` : '') + d.items.map(itemHtml).join(''));
          body.scrollTop = body.scrollHeight - prevH;
        }
      });
      first();
    }

    async function refreshTerminals() {
      try {
        const [st, pj] = await Promise.all([fetch(`${ORCHESTRATOR_URL}/status`).then((r) => r.json()), fetch(`${ORCHESTRATOR_URL}/plan`).then((r) => r.json()).catch(() => ({}))]);
        lastStatus = st; planData = pj.plan || null;
        const agents = st.agents || [];
        if (st.error) { terminalsContainer.innerHTML = `<div class="empty-state"><div>${esc(st.error)}</div></div>`; return; }
        // Don't wipe the standing-instruction input while someone is typing in it.
        const typing = document.activeElement && (document.activeElement.id === 'standingInput' || document.activeElement.id === 'ctxThresh');
        if (typing) return;
        terminalsContainer.innerHTML = needsLane(st.needsYou || []) + planPanel(agents) + summaryStrip(st)
          + (agents.map(agentCard).join('') || '<div class="empty-state"><div>No agents running</div></div>') + standingPanel();
        for (const sid of rawOpen) {
          const pre = terminalsContainer.querySelector(`[data-raw="${sid}"]`);
          if (pre) fetch(`${ORCHESTRATOR_URL}/terminals?tail=1500`).then((r) => r.json()).then((tl) => {
            const s = (tl.sessions || []).find((x) => x.sid === sid);
            pre.textContent = (s ? s.bufferTail.split('\n').filter((l) => l.trim() && !/^[\s─━│╭╮╰╯]+$/.test(l)).slice(-30).join('\n') : '') || '(nothing readable)';
          }).catch(() => {});
        }
      } catch (error) { console.error('Error refreshing agents:', error); }
    }

    // ---- confirmation + toasts ----
    function toast(text, level) {
      let box = document.getElementById('toasts');
      if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
      const t = document.createElement('div'); t.className = 'toast ' + (level || 'info'); t.textContent = text;
      box.appendChild(t); setTimeout(() => t.remove(), 9000);
    }
    function confirmDialog(title, body, okLabel) {
      return new Promise((resolve) => {
        const ov = document.createElement('div'); ov.className = 'overlay';
        ov.innerHTML = `<div class="dialog"><h3>${esc(title)}</h3><p>${esc(body)}</p><div class="dlg-actions"><button class="cancel">Cancel</button><button class="go">${esc(okLabel)}</button></div></div>`;
        ov.querySelector('.cancel').onclick = () => { ov.remove(); resolve(false); };
        ov.querySelector('.go').onclick = () => { ov.remove(); resolve(true); };
        document.body.appendChild(ov);
      });
    }
    const ACTION_TEXT = {
      compact: ['Compact this agent?', 'Runs /compact: its context is replaced by a summary and this cannot be undone.', 'Compact'],
      retest: ['Ask it to re-run its tests?', 'Sends it a message asking it to re-run its tests or checks and report exactly what passed and failed.', 'Send'],
      stop: ['Interrupt this agent?', 'Sends Esc, which interrupts what it is doing right now. The conversation is kept.', 'Interrupt'],
    };
    async function post(path, body) {
      const r = await fetch(`${ORCHESTRATOR_URL}${path}`, { method: ['/decide', '/action', '/standing', '/done/backfill'].includes(path) ? 'POST' : 'DELETE', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
      return r.json();
    }

    terminalsContainer.addEventListener('change', (e) => {
      if (e.target.id !== 'ctxThresh') return;
      ctxThreshold = Number(e.target.value);
      try { localStorage.setItem('ctxThreshold', String(ctxThreshold)); } catch { /* storage unavailable */ }
      e.target.blur(); refreshTerminals();
    });
    terminalsContainer.addEventListener('click', async (e) => {
      const btn = e.target.closest('button');
      if (btn && btn.dataset.act) {
        const card = btn.closest('.agent-card'); const a = (lastStatus?.agents || []).find((x) => x.sid === btn.dataset.sid);
        const [title, body, ok] = ACTION_TEXT[btn.dataset.act];
        if (!(await confirmDialog(title, `Target: “${a?.topic || a?.label}” [${btn.dataset.sid.slice(0, 8)}]\n${body}`, ok))) return;
        const res = await post('/action', { sid: btn.dataset.sid, action: btn.dataset.act });
        toast(res.message || 'Done', res.ok ? 'info' : 'warn'); refreshTerminals(); return;
      }
      if (btn && btn.dataset.decide) {
        const verb = btn.dataset.decide === 'approve' ? 'Approve' : 'Deny';
        if (!(await confirmDialog(`${verb} this?`, `${btn.dataset.title}\n${btn.dataset.detail}`, verb))) return;
        const res = await post('/decide', { id: btn.dataset.id, decision: btn.dataset.decide });
        toast(res.message || 'Done', res.ok ? 'info' : 'warn'); refreshTerminals(); return;
      }
      if (btn && btn.dataset.backfill) { const r = await post('/done/backfill', { sid: btn.dataset.backfill }); toast(r.message || 'Loading earlier work…', r.ok ? 'info' : 'warn'); return; }
      if (btn && btn.dataset.convo) { openConversation(btn.dataset.convo, btn.dataset.title); return; }
      if (btn && btn.dataset.rawToggle) { const k = btn.dataset.rawToggle; rawOpen.has(k) ? rawOpen.delete(k) : rawOpen.add(k); refreshTerminals(); return; }
      if (btn && btn.dataset.delStanding) { await post('/standing/' + btn.dataset.delStanding); standingList = (await fetch(`${ORCHESTRATOR_URL}/standing`).then((r) => r.json())).standing; refreshTerminals(); return; }
      if (btn && btn.id === 'standingAdd') {
        const inp = document.getElementById('standingInput'); const text = inp.value.trim(); if (!text) return;
        await post('/standing', { text }); standingList = (await fetch(`${ORCHESTRATOR_URL}/standing`).then((r) => r.json())).standing; refreshTerminals(); return;
      }
      if (btn && btn.id === 'enableAlerts') { Notification.requestPermission().then((p) => toast(p === 'granted' ? 'Desktop alerts on' : 'Desktop alerts blocked by the browser', 'info')); return; }
      if (e.target.closest('[data-toggle-plan]')) { planOpen = !planOpen; refreshTerminals(); return; }
      if (e.target.closest('[data-toggle-standing]')) { standingOpen = !standingOpen; refreshTerminals(); return; }
      if (btn || e.target.closest('input')) return;
      const card = e.target.closest('.agent-card'); if (!card) return;
      const sid = card.dataset.sid; expanded.has(sid) ? expanded.delete(sid) : expanded.add(sid); refreshTerminals();
    });
    fetch(`${ORCHESTRATOR_URL}/standing`).then((r) => r.json()).then((d) => { standingList = d.standing || []; }).catch(() => {});

    // Restore the conversation after a refresh (the orchestrator session persists server-side), then go live.
    async function restoreHistory() {
      try {
        const { messages, busy } = await fetch(`${ORCHESTRATOR_URL}/history`).then((r) => r.json());
        stopBtn.style.display = busy ? 'inline-block' : 'none';
        if (messages && messages.length) {
          messagesContainer.innerHTML = '';
          for (const m of messages) {
            if (m.role === 'user') { addMessage('user', m.text); continue; }
            if (m.role === 'system') { note('↩ ' + m.text); continue; }
            const div = addMessage('assistant', '');
            const steps = document.createElement('div'); steps.className = 'steps';
            for (const st of m.steps || []) { const x = document.createElement('div'); x.textContent = '→ ' + st; steps.appendChild(x); }
            const reply = document.createElement('div'); reply.innerHTML = renderReply(m.text || '');
            div.append(steps, reply);
          }
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
      } catch (e) { /* no history yet */ }
      connectEvents();
    }
    restoreHistory();

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    stopBtn.addEventListener('click', () => fetch(`${ORCHESTRATOR_URL}/stop`, { method: 'POST' }));

    // Voice input: browser speech recognition fills the box and sends when you pause.
    const micBtn = document.getElementById('micBtn');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      micBtn.style.display = 'none';
    } else {
      const rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = true;
      rec.continuous = false;
      rec.onresult = (e) => {
        let t = '';
        for (const r of e.results) t += r[0].transcript;
        messageInput.value = t;
        if (e.results[e.results.length - 1].isFinal) sendMessage();
      };
      rec.onend = () => micBtn.classList.remove('listening');
      rec.onerror = () => micBtn.classList.remove('listening');
      micBtn.addEventListener('click', () => {
        if (micBtn.classList.contains('listening')) { rec.stop(); return; }
        micBtn.classList.add('listening');
        try { rec.start(); } catch { micBtn.classList.remove('listening'); }
      });
    }
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Initial terminal refresh
    refreshTerminals();
    setInterval(refreshTerminals, 3000);
  </script>
</body>
</html>
